name: otter-core
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core Python
  # rmats 4.4.0 ships a Python 3.10 build; it has no Python 3.11 build.
  - python>=3.9
  - numpy
  - pandas

  # QC Tools
  - fastqc
  - seqkit
  - seqtk
  - qualimap

  # Methylation Analysis
  # Bismark 3.1.0 is the supported suite; Bowtie2 2.5.5 is explicitly pinned to
  # satisfy its documented runtime dependency, and Bowtie2 2.5.5 requires
  # libzlib >= 1.3.1. `rmats=4.1.2` and `bwa=0.7.17` require zlib < 1.3 and make the
  # environment unsolvable next to Bowtie2 2.5.5, so both are pinned to builds that
  # accept libzlib 1.3.x.
  - bismark=3.1.0
  - bowtie2=2.5.5
  - trim-galore
  - samtools>=1.15
  - hdf5

  # RNA-seq Analysis
  - star
  - htseq
  - rmats=4.4.0

  # General Bioinformatics
  - picard

  # ChIP-seq/ATAC-seq Core Tools
  - macs2
  - bwa=0.7.19            # Alignment for ChIP-seq
  - pyyaml
