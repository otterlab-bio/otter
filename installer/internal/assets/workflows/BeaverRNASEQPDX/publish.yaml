name: BeaverRNASEQPDX publish
version: 1
on:
  otter:
    workflow: BeaverRNASEQPDX
    phase: publish
    modes: [RNASEQ]
defaults:
  shell: bash
  observability:
    metrics: task
    capture_stdout: true
    capture_stderr: true
    compress_success_logs: true
jobs:
  publish_artifacts:
    name: Publish immutable BeaverRNASEQPDX artifacts
    scope: global
    dimensions: []
    inputs:
      filtered_bam_directory: "${{ config.directories.bsmap.main }}/Filtered_bams"
      count_matrix: "${{ config.directories.beta_matrix }}/matrix_count.txt"
      normalized_matrix: "${{ config.directories.beta_matrix }}/matrix_norm.txt"
      qc_summary: "${{ config.directories.qc_summary }}/qc_summary.xlsx"
      splicing_outcome: "${{ config.directories.bsmap.main }}/RNASplicing/splicing-outcome.json"
    outputs:
      classification_summary: "${{ paths.results }}/pdx/graft/classification.tsv"
      declarations: "${{ paths.work }}/publish/beaverrnaseqpdx-artifacts.json"
      manifest: "${{ paths.results }}/artifacts.json"
    resources:
      cores: 1
      memory: 1G
      partition: amd_512
    steps:
      - name: Stage and publish checked RNA-seq PDX results
        run: |
          results_root='${{ paths.results }}'
          staging_parent="$results_root/.publish-staging"
          declaration_path='${{ outputs.declarations }}'
          manifest_path='${{ outputs.manifest }}'
          filtered_directory='${{ inputs.filtered_bam_directory }}'
          final_graft_directory="$results_root/pdx/graft"
          final_splicing_directory="$results_root/splicing"
          otter_cli="${OTTER:-otter}"
          shopt -s nullglob
          filtered_bams=("$filtered_directory"/*_Filtered.bam)
          if [ "${#filtered_bams[@]}" -eq 0 ]; then
            printf 'No graft filtered BAMs were found in %s\n' "$filtered_directory" >&2
            exit 1
          fi
          if [ -e "$manifest_path" ]; then
            "$otter_cli" artifact verify '${{ paths.config }}'
            exit 0
          fi
          mkdir -p "$staging_parent" "$(dirname "$declaration_path")"
          staging_root="$(mktemp -d "$staging_parent/rna-pdx.XXXXXX")"
          trap 'rm -rf "$staging_root"' EXIT
          graft_directory="$staging_root/pdx/graft"
          staging_splicing_directory="$staging_root/splicing"
          mkdir -p "$graft_directory"
          classification_summary="$graft_directory/classification.tsv"
          printf 'artifact_index\tsource_bam\tsource_bai\tmapped_reads\n' > "$classification_summary"
          artifact_index=0
          for source_bam in "${filtered_bams[@]}"; do
            source_bai="${source_bam}.bai"
            if [ ! -s "$source_bam" ] || [ ! -s "$source_bai" ]; then
              printf 'Missing non-empty filtered BAM/BAI pair: %s and %s\n' "$source_bam" "$source_bai" >&2
              exit 1
            fi
            samtools quickcheck -v "$source_bam"
            artifact_index=$((artifact_index + 1))
            target_bam="$graft_directory/$(basename "$source_bam")"
            target_bai="${target_bam}.bai"
            cp -- "$source_bam" "$target_bam"
            cp -- "$source_bai" "$target_bai"
            samtools quickcheck -v "$target_bam"
            mapped_reads="$(samtools view -c -F 4 "$target_bam")"
            if [ "$mapped_reads" -le 0 ]; then
              printf 'Filtered graft BAM has no mapped reads: %s\n' "$target_bam" >&2
              exit 1
            fi
            printf '%04d\t%s\t%s\t%s\n' "$artifact_index" "$(basename "$target_bam")" "$(basename "$target_bai")" "$mapped_reads" >> "$classification_summary"
          done
          python - "$declaration_path" "$graft_directory" '${{ inputs.splicing_outcome }}' "$staging_splicing_directory" <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import sys

          declaration_path = pathlib.Path(sys.argv[1])
          graft_directory = pathlib.Path(sys.argv[2])
          outcome_path = pathlib.Path(sys.argv[3])
          splicing_directory = pathlib.Path(sys.argv[4])
          artifact_entries = []
          for artifact_index, bam_path in enumerate(sorted(graft_directory.glob("*_Filtered.bam")), start=1):
              bai_path = pathlib.Path(str(bam_path) + ".bai")
              if not bai_path.is_file():
                  raise SystemExit(f"missing staged BAM index: {bai_path}")
              artifact_entries.extend([
                  {
                      "id": f"graft-alignment-bam-{artifact_index:04d}",
                      "path": f"pdx/graft/{bam_path.name}",
                      "media_type": "application/x-bam",
                      "schema": "sam-bam/v1",
                      "comparison": {
                          "tier": "structural",
                          "comparator": "bam-pair-structure/v1",
                      },
                  },
                  {
                      "id": f"graft-alignment-bai-{artifact_index:04d}",
                      "path": f"pdx/graft/{bai_path.name}",
                      "media_type": "application/x-bam-index",
                      "schema": "sam-bai/v1",
                      "comparison": {
                          "tier": "structural",
                          "comparator": "bam-pair-structure/v1",
                      },
                  },
              ])
          outcome = json.loads(outcome_path.read_text(encoding="utf-8"))
          expected_keys = {"schema_version", "status", "source_root", "artifact_paths"}
          if set(outcome) != expected_keys or outcome["schema_version"] != "otter.rna-splicing-outcome/v1":
              raise SystemExit("invalid RNA splicing outcome document")
          if outcome["status"] not in {"produced", "not_applicable"} or not isinstance(outcome["artifact_paths"], list):
              raise SystemExit("invalid RNA splicing outcome status or artifact paths")
          if outcome["status"] == "produced" and not outcome["artifact_paths"]:
              raise SystemExit("produced RNA splicing outcome requires artifact paths")
          if outcome["status"] == "not_applicable" and outcome["artifact_paths"]:
              raise SystemExit("not_applicable RNA splicing outcome must not declare artifact paths")
          source_root = pathlib.Path(outcome["source_root"]).resolve()
          if not source_root.is_dir():
              raise SystemExit(f"RNA splicing source root does not exist: {source_root}")
          splicing_directory.mkdir(parents=True)
          shutil.copy2(outcome_path, splicing_directory / "outcome.json")
          artifact_entries.append({
              "id": "splicing-outcome",
              "path": "splicing/outcome.json",
              "media_type": "application/json",
              "schema": "otter.rna-splicing-outcome/v1",
              "comparison": {"tier": "structural", "comparator": "rna-splicing-outcome/v1"},
          })
          for artifact_index, relative_path in enumerate(sorted(outcome["artifact_paths"]), start=1):
              relative_artifact = pathlib.PurePosixPath(relative_path)
              if relative_artifact.is_absolute() or ".." in relative_artifact.parts:
                  raise SystemExit(f"unsafe RNA splicing artifact path: {relative_path}")
              source_path = (source_root / relative_artifact).resolve()
              if not source_path.is_file() or source_root not in source_path.parents:
                  raise SystemExit(f"RNA splicing artifact is not a regular source file: {relative_path}")
              target_path = splicing_directory / "files" / relative_artifact
              target_path.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source_path, target_path)
              artifact_entries.append({
                  "id": f"splicing-output-{artifact_index:04d}",
                  "path": f"splicing/files/{relative_artifact.as_posix()}",
                  "media_type": "application/octet-stream",
                  "schema": "otter.rna-splicing-output/v1",
                  "comparison": {"tier": "exact", "comparator": "exact-file/v1"},
              })
          artifact_entries.extend([
              {
                  "id": "graft-classification-summary",
                  "path": "pdx/graft/classification.tsv",
                  "media_type": "text/tab-separated-values",
                  "schema": "otter.pdx-graft-classification/v1",
                  "comparison": {
                      "tier": "scientific",
                      "comparator": "pdx-graft-read-counts/v1",
                  },
              },
              {
                  "id": "expression-count-matrix",
                  "path": "methylation/matrix_count.txt",
                  "media_type": "text/tab-separated-values",
                  "schema": "otter.expression-count-matrix/v1",
                  "comparison": {
                      "tier": "scientific",
                      "comparator": "expression-count-matrix/v1",
                  },
              },
              {
                  "id": "expression-normalized-matrix",
                  "path": "methylation/matrix_norm.txt",
                  "media_type": "text/tab-separated-values",
                  "schema": "otter.expression-normalized-matrix/v1",
                  "comparison": {
                      "tier": "scientific",
                      "comparator": "expression-count-matrix/v1",
                  },
              },
              {
                  "id": "qc-summary",
                  "path": "qc/qc_summary.xlsx",
                  "media_type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                  "schema": "otter.qc-summary/v1",
                  "comparison": {
                      "tier": "structural",
                      "comparator": "xlsx-structure/v1",
                  },
              },
          ])
          document = {
              "schema_version": "otter.artifact-declarations/v1",
              "artifacts": artifact_entries,
          }
          temporary_declaration_path = declaration_path.with_suffix(declaration_path.suffix + ".tmp")
          temporary_declaration_path.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          os.replace(temporary_declaration_path, declaration_path)
          PY

          publish_directory() {
            local staged_directory="$1"
            local published_directory="$2"
            if [ -e "$published_directory" ]; then
              python - "$staged_directory" "$published_directory" <<'PY'
          import hashlib
          import pathlib
          import sys

          def digest_tree(root):
              entries = []
              for candidate in sorted(root.rglob("*")):
                  if candidate.is_symlink() or not candidate.is_file():
                      if candidate.is_dir():
                          continue
                      raise SystemExit(f"published RNA-PDX tree contains a non-regular file: {candidate}")
                  entries.append((candidate.relative_to(root).as_posix(), hashlib.sha256(candidate.read_bytes()).hexdigest()))
              return entries

          if digest_tree(pathlib.Path(sys.argv[1])) != digest_tree(pathlib.Path(sys.argv[2])):
              raise SystemExit("existing RNA-PDX publication differs from the staged retry payload")
          PY
            else
              mkdir -p "$(dirname "$published_directory")"
              mv "$staged_directory" "$published_directory"
            fi
          }
          publish_directory "$graft_directory" "$final_graft_directory"
          publish_directory "$staging_splicing_directory" "$final_splicing_directory"

          "$otter_cli" artifact publish '${{ paths.config }}' "$declaration_path"
          test -f "$manifest_path"
          test "$(stat -c '%a' "$manifest_path")" = 444
          "$otter_cli" artifact verify '${{ paths.config }}'
