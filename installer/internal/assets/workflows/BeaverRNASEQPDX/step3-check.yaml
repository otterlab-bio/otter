name: BeaverRNASEQPDX step3 check
version: 1
on:
  otter:
    workflow: BeaverRNASEQPDX
    phase: step3-check
    modes: [RNASEQ]
defaults:
  shell: bash
  environment: otter-core
  observability:
    metrics: task
    capture_stdout: true
    capture_stderr: true
    compress_success_logs: true
jobs:
  sample_artifacts:
    name: Validate BeaverRNASEQPDX sample artifacts
    scope: sample
    dimensions: [sample]
    inputs:
      counts: "${{ config.directories.methylation_call }}/${{ sample.id }}_${{ config.workflow.species.graft }}.txt"
      filtered_bam: "${{ config.directories.bsmap.main }}/Filtered_bams/${{ sample.id }}_fixed_${{ config.workflow.species.graft }}_Filtered.bam"
      trim_report_r1: "${{ config.output.trim_dir }}/${{ sample.id }}_R1.fastq.gz_trimming_report.txt"
      trim_report_r2: "${{ config.output.trim_dir }}/${{ sample.id }}_R2.fastq.gz_trimming_report.txt"
      fastqc_before_r1: "${{ config.directories.qc.before }}/${{ sample.id }}_R1_fastqcx/fastqc_data.txt"
      fastqc_before_r2: "${{ config.directories.qc.before }}/${{ sample.id }}_R2_fastqcx/fastqc_data.txt"
      fastqc_after_r1: "${{ config.directories.qc.after }}/${{ sample.id }}_val_1_fastqcx/fastqc_data.txt"
      fastqc_after_r2: "${{ config.directories.qc.after }}/${{ sample.id }}_val_2_fastqcx/fastqc_data.txt"
    outputs:
      ready: "${{ config.directories.sid_log }}/step3-check/${{ sample.id }}.ready"
    resources:
      cores: 1
      memory: 1G
      partition: amd_512
    steps:
      - name: Write validated BeaverRNASEQPDX step3 artifact manifest
        run: |
          output_path='${{ outputs.ready }}'
          mkdir -p "$(dirname "$output_path")"
          temporary_path="$(mktemp "${output_path}.tmp.XXXXXX")"
          trap 'rm -f "$temporary_path"' EXIT

          ensure_json_safe_string() {
            local value="$1"
            if printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]"\\]'; then
              printf 'validated artifact metadata contains unsupported JSON characters: %s\n' "$value" >&2
              exit 1
            fi
          }

          write_artifact() {
            local artifact_id="$1" artifact_path="$2" media_type="$3"
            ensure_json_safe_string "$artifact_id"
            ensure_json_safe_string "$artifact_path"
            ensure_json_safe_string "$media_type"
            if [[ -L "$artifact_path" || ! -f "$artifact_path" ]]; then
              printf 'validated artifact must be a regular non-symlink file: %s\n' "$artifact_path" >&2
              exit 1
            fi
            local size_bytes sha256
            size_bytes="$(wc -c < "$artifact_path" | tr -d '[:space:]')"
            if [[ ! "$size_bytes" =~ ^[1-9][0-9]*$ ]]; then
              printf 'validated artifact must be non-empty: %s\n' "$artifact_path" >&2
              exit 1
            fi
            sha256="$(sha256sum -- "$artifact_path" | awk '{print $1}')"
            if [[ ! "$sha256" =~ ^[a-f0-9]{64}$ ]]; then
              printf 'could not calculate SHA-256 for validated artifact: %s\n' "$artifact_path" >&2
              exit 1
            fi
            printf '{"id":"%s","path":"%s","media_type":"%s","size_bytes":%s,"sha256":"%s"}' \
              "$artifact_id" "$artifact_path" "$media_type" "$size_bytes" "$sha256"
          }

          ensure_json_safe_string '${{ sample.id }}'
          {
            printf '{"schema_version":"otter.sample-artifacts-validation/v1","status":"validated","workflow":"BeaverRNASEQPDX","phase":"step3-check","sample_id":"%s","dimensions":{"sample":"%s"},"artifacts":[' '${{ sample.id }}' '${{ sample.id }}'
            first_artifact=true
            for artifact in \
              "counts|${{ inputs.counts }}|text/plain" \
              "filtered_bam|${{ inputs.filtered_bam }}|application/x-bam" \
              "trim_report_r1|${{ inputs.trim_report_r1 }}|text/plain" \
              "trim_report_r2|${{ inputs.trim_report_r2 }}|text/plain" \
              "fastqc_before_r1|${{ inputs.fastqc_before_r1 }}|text/plain" \
              "fastqc_before_r2|${{ inputs.fastqc_before_r2 }}|text/plain" \
              "fastqc_after_r1|${{ inputs.fastqc_after_r1 }}|text/plain" \
              "fastqc_after_r2|${{ inputs.fastqc_after_r2 }}|text/plain"; do
              IFS='|' read -r artifact_id artifact_path media_type <<< "$artifact"
              if ! "$first_artifact"; then printf ','; fi
              write_artifact "$artifact_id" "$artifact_path" "$media_type"
              first_artifact=false
            done
            printf ']}\n'
          } > "$temporary_path"
          mv -f "$temporary_path" "$output_path"
          trap - EXIT

  species_qc_artifacts:
    name: Validate BeaverRNASEQPDX species mapping QC artifacts
    scope: sample
    dimensions: [sample, species]
    inputs:
      sorted_bam: "${{ config.directories.bsmap.main }}/${{ sample.id }}_${{ species.name }}.bam"
      qualimap_report: "${{ config.directories.qualimap }}/${{ sample.id }}_${{ species.name }}/qualimapReport.html"
    outputs:
      ready: "${{ config.directories.sid_log }}/step3-check/${{ sample.id }}_${{ species.name }}_qc.ready"
    resources:
      cores: 1
      memory: 1G
      partition: amd_512
    steps:
      - name: Write validated BeaverRNASEQPDX species QC artifact manifest
        run: |
          output_path='${{ outputs.ready }}'
          mkdir -p "$(dirname "$output_path")"
          temporary_path="$(mktemp "${output_path}.tmp.XXXXXX")"
          trap 'rm -f "$temporary_path"' EXIT

          ensure_json_safe_string() {
            local value="$1"
            if printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]"\\]'; then
              printf 'validated artifact metadata contains unsupported JSON characters: %s\n' "$value" >&2
              exit 1
            fi
          }

          write_artifact() {
            local artifact_id="$1" artifact_path="$2" media_type="$3"
            ensure_json_safe_string "$artifact_id"
            ensure_json_safe_string "$artifact_path"
            ensure_json_safe_string "$media_type"
            if [[ -L "$artifact_path" || ! -f "$artifact_path" ]]; then
              printf 'validated artifact must be a regular non-symlink file: %s\n' "$artifact_path" >&2
              exit 1
            fi
            local size_bytes sha256
            size_bytes="$(wc -c < "$artifact_path" | tr -d '[:space:]')"
            if [[ ! "$size_bytes" =~ ^[1-9][0-9]*$ ]]; then
              printf 'validated artifact must be non-empty: %s\n' "$artifact_path" >&2
              exit 1
            fi
            sha256="$(sha256sum -- "$artifact_path" | awk '{print $1}')"
            if [[ ! "$sha256" =~ ^[a-f0-9]{64}$ ]]; then
              printf 'could not calculate SHA-256 for validated artifact: %s\n' "$artifact_path" >&2
              exit 1
            fi
            printf '{"id":"%s","path":"%s","media_type":"%s","size_bytes":%s,"sha256":"%s"}' \
              "$artifact_id" "$artifact_path" "$media_type" "$size_bytes" "$sha256"
          }

          ensure_json_safe_string '${{ sample.id }}'
          ensure_json_safe_string '${{ species.name }}'
          {
            printf '{"schema_version":"otter.sample-artifacts-validation/v1","status":"validated","workflow":"BeaverRNASEQPDX","phase":"step3-check","sample_id":"%s","dimensions":{"sample":"%s","species":"%s"},"artifacts":[' '${{ sample.id }}' '${{ sample.id }}' '${{ species.name }}'
            write_artifact 'sorted_bam' '${{ inputs.sorted_bam }}' 'application/x-bam'
            printf ','
            write_artifact 'qualimap_report' '${{ inputs.qualimap_report }}' 'text/html'
            printf ']}\n'
          } > "$temporary_path"
          mv -f "$temporary_path" "$output_path"
          trap - EXIT

  construct_expression_matrix:
    name: Construct BeaverRNASEQPDX expression matrices
    scope: global
    dimensions: []
    inputs:
      sample_artifacts: "${{ jobs.sample_artifacts.outputs.ready }}"
    outputs:
      count_matrix: "${{ config.directories.beta_matrix }}/matrix_count.txt"
      normalized_matrix: "${{ config.directories.beta_matrix }}/matrix_norm.txt"
    resources:
      cores: 5
      memory: 8G
      partition: amd_512
    steps:
      - name: Build graft expression matrices
        run: |
          mkdir -p '${{ config.directories.beta_matrix }}'
          seq2mat --htseq_dir '${{ config.directories.methylation_call }}' --output_dir '${{ config.directories.beta_matrix }}' --postfix '_${{ config.workflow.species.graft }}.txt' --species '${{ config.workflow.species.expression }}'

  qc_summary:
    name: Build BeaverRNASEQPDX QC summary
    scope: global
    dimensions: []
    inputs:
      sample_artifacts: "${{ jobs.sample_artifacts.outputs.ready }}"
      species_qc_artifacts: "${{ jobs.species_qc_artifacts.outputs.ready }}"
      run_config: "${{ paths.config }}"
    outputs:
      report: "${{ config.directories.qc_summary }}/qc_summary.xlsx"
    resources:
      cores: 5
      memory: 8G
      partition: amd_512
    steps:
      - name: Run RNA-seq PDX QC summary
        environment: otter-core
        run: |
          mkdir -p '${{ config.directories.qc_summary }}'
          qctb --config '${{ inputs.run_config }}' --output '${{ outputs.report }}' --rnaseq
