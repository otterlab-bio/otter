name: BeaverBS publish
version: 1
on:
  otter:
    workflow: BeaverBS
    phase: publish
    modes: [RRBS, WGBS, BSSEQ]
defaults:
  shell: bash
  observability:
    metrics: task
    capture_stdout: true
    capture_stderr: true
    compress_success_logs: true
jobs:
  publish_artifacts:
    name: Publish immutable BeaverBS artifacts
    scope: global
    dimensions: []
    inputs:
      methrix_data: "${{ config.directories.methylation_call }}/methrixh5/methrix_data.h5"
      bismark_summary: "${{ config.directories.bsmap.main }}/${{ config.workflow.species.graft }}/bismark_summary_report.html"
      qc_summary: "${{ config.directories.qc_summary }}/qc_summary.xlsx"
    outputs:
      methrix_data: "${{ paths.results }}/methylation/methrix_data.h5"
      bismark_summary: "${{ paths.results }}/methylation/bismark_summary_report.html"
      declarations: "${{ paths.work }}/publish/beaverbs-artifacts.json"
      manifest: "${{ paths.results }}/artifacts.json"
    resources:
      cores: 1
      memory: 1G
      partition: amd_512
    steps:
      - name: Stage and publish checked BeaverBS results
        run: |
          results_root='${{ paths.results }}'
          final_methylation_directory="$results_root/methylation"
          staging_parent="$results_root/.publish-staging"
          declaration_path='${{ outputs.declarations }}'
          manifest_path='${{ outputs.manifest }}'
          otter_cli="${OTTER:-otter}"

          if [ -e "$manifest_path" ]; then
            "$otter_cli" artifact verify '${{ paths.config }}'
            exit 0
          fi

          mkdir -p "$staging_parent" "$(dirname "$declaration_path")"
          staging_root="$(mktemp -d "$staging_parent/bs.XXXXXX")"
          trap 'rm -rf "$staging_root"' EXIT
          staging_methylation_directory="$staging_root/methylation"
          mkdir -p "$staging_methylation_directory"
          cp -- '${{ inputs.methrix_data }}' "$staging_methylation_directory/methrix_data.h5"
          cp -- '${{ inputs.bismark_summary }}' "$staging_methylation_directory/bismark_summary_report.html"
          test -s "$staging_methylation_directory/methrix_data.h5"
          test -s "$staging_methylation_directory/bismark_summary_report.html"

          temporary_declaration_path="$declaration_path.tmp"
          cat > "$temporary_declaration_path" <<'JSON'
          {
            "schema_version": "otter.artifact-declarations/v1",
            "artifacts": [
              {
                "id": "methylation-matrix",
                "path": "methylation/methrix_data.h5",
                "media_type": "application/x-hdf5",
                "schema": "methrix-se/v1",
                "comparison": {
                  "tier": "scientific",
                  "comparator": "methrix-semantics/v1"
                }
              },
              {
                "id": "bismark-summary",
                "path": "methylation/bismark_summary_report.html",
                "media_type": "text/html",
                "schema": "otter.bismark-summary/v1",
                "comparison": {
                  "tier": "informational",
                  "comparator": "bismark-summary/v1"
                }
              },
              {
                "id": "qc-summary",
                "path": "qc/qc_summary.xlsx",
                "media_type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                "schema": "otter.qc-summary/v1",
                "comparison": {
                  "tier": "structural",
                  "comparator": "xlsx-structure/v1"
                }
              }
            ]
          }
          JSON
          mv "$temporary_declaration_path" "$declaration_path"

          if [ -e "$final_methylation_directory" ]; then
            python3 - "$staging_methylation_directory" "$final_methylation_directory" <<'PY'
          import hashlib
          import pathlib
          import sys

          def digest_tree(root):
              entries = []
              for candidate in sorted(root.rglob("*")):
                  if candidate.is_symlink() or not candidate.is_file():
                      if candidate.is_dir():
                          continue
                      raise SystemExit(f"published methylation tree contains a non-regular file: {candidate}")
                  entries.append((candidate.relative_to(root).as_posix(), hashlib.sha256(candidate.read_bytes()).hexdigest()))
              return entries

          if digest_tree(pathlib.Path(sys.argv[1])) != digest_tree(pathlib.Path(sys.argv[2])):
              raise SystemExit("existing methylation publication differs from the staged retry payload")
          PY
          else
            mv "$staging_methylation_directory" "$final_methylation_directory"
          fi

          "$otter_cli" artifact publish '${{ paths.config }}' "$declaration_path"
          test -f "$manifest_path"
          manifest_mode="$(stat -c '%a' "$manifest_path" 2>/dev/null || stat -f '%Lp' "$manifest_path")"
          test "$manifest_mode" = 444
          "$otter_cli" artifact verify '${{ paths.config }}'
