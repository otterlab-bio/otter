name: Go CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      # Deliberately before the test steps: a dependency whose tag was moved
      # after publication makes every cold download fail its sumdb check, and a
      # warm setup-go cache hides that for as long as the cache key is stable.
      - name: Verify module checksums against a cold cache
        run: bash scripts/ci/verify-module-checksums.sh

      - name: Verify toolchain consistency
        run: bash scripts/verify_toolchain_consistency.sh

      - name: Verify the job-summary helper copies are in sync
        run: bash scripts/ci/check-job-summary-sync.sh

      - name: Run tests
        run: |
          go mod download
          go test -v ./...
          go vet ./...
          go build -o /tmp/otter .

      - name: Run submodule tests (bamdriver)
        run: |
          cd bamdriver
          go test -v ./...

      - name: Run submodule tests (pairbam)
        run: |
          cd pairbam
          go test -v ./...

      - name: Run submodule tests (xenofilx)
        run: |
          cd xenofilx
          go test -count=1 ./...
          go vet ./...
          # Keep the race gate aligned with xenofilx CI: real-BAM/BGZF tests
          # are covered by the normal suite and exceed runner budgets under race.
          go test -race -count=1 -short ./...
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          bash scripts/ci/job-summary.sh \
            --verdict "${{ job.status }}" \
            --title "OTTER — Go CI/CD test" \
            --checked "Runs the umbrella Go test suite, vet and build, then the bamdriver, pairbam and xenofilx submodule suites including the xenofilx race gate and govulncheck. Verifies the pinned toolchain contract first." \
            --check "Toolchain consistency|verify_toolchain_consistency.sh passes|see step log|-" \
            --check "Umbrella Go tests, vet, build|all pass|see step log|-" \
            --check "bamdriver submodule tests|pass|see step log|-" \
            --check "pairbam submodule tests|pass|see step log|-" \
            --check "xenofilx tests, race gate, govulncheck|pass|see step log|-" \
            --metric "Go toolchain|1.26.3 (pinned by setup-go)" \
            --limit "Unit and integration tests over the checked-out tree, including submodules at this commit. This is the compile-and-test gate, not the real-BAM Gate A-D evidence." \
            --note "All submodules are public, so they are checked out without a token."

  pr-brief:
    name: Publish PR briefing
    needs: test
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or update the CI briefing
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const marker = '<!-- otter-pr-brief:go-ci -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const describe = (result) => ({
              success: '✅ passed',
              failure: '❌ failed',
              cancelled: '⚪ cancelled',
              skipped: '⚪ skipped',
            }[result] ?? `⚠️ ${result}`);

            const body = `${marker}
            ## OTTER CI briefing

            | Gate | Result |
            |---|---|
            | Go tests, vet, and umbrella build | ${describe(process.env.TEST_RESULT)} |

            The test gate also runs the bamdriver, pairbam, and xenofilx suites, including xenofilx's short race gate and \`govulncheck\`. The separate Build Toolchain Platforms workflow builds and checks the four release platforms.

            [Open this CI run](${runUrl}) · Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`

            _This comment is updated on each push, so the PR keeps one current CI briefing._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
