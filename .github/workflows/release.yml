name: Release Binaries

on:
  push:
    # Tags only. The daily build is scheduled rather than pushed: a branch filter here made
    # every commit to main start a full release build, so pushing a commit together with its
    # tag started two runs for one release.
    tags: [ 'v*.*.*', 'daily-*' ]
  schedule:
    # Daily release, so auto mode no longer depends on a push to main.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag. Leave empty to publish/update daily-YYYYMMDD.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools cmake zlib1g-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify module checksums against a cold cache
        run: bash scripts/ci/verify-module-checksums.sh

      - name: Test parent project
        run: go test -count=1 -short -buildvcs=false ./internal/... ./cmd/...

      - name: Test bamdriver
        run: cd bamdriver && go test -count=1 ./...

      - name: Test matsrun
        run: cd matsrun && go test -count=1 ./...

      - name: Test seq2mat
        run: cd seq2mat && go test -count=1 -short ./...

      - name: Test pairbam
        run: cd pairbam && go test -count=1 ./...

      - name: Test xenofilx
        run: cd xenofilx && go test -count=1 -short ./...

      - name: Test methx
        run: |
          cd methx
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          bash scripts/ci/job-summary.sh \
            --verdict "${{ job.status }}" \
            --title "OTTER — Release pre-flight tests" \
            --checked "Runs every member's test suite before the release job is allowed to start: the umbrella project, bamdriver, matsrun, seq2mat, pairbam, xenofilx and methx." \
            --check "Parent project tests|pass|see step log|-" \
            --check "bamdriver tests|pass|see step log|-" \
            --check "matsrun tests|pass|see step log|-" \
            --check "seq2mat tests|pass|see step log|-" \
            --check "pairbam tests|pass|see step log|-" \
            --check "xenofilx tests (short)|pass|see step log|-" \
            --check "methx fmt, clippy -D warnings, tests|all pass|see step log|-" \
            --limit "A gate on the release, not a release itself: no artifact is produced here. xenofilx runs the short suite by design to keep release latency bounded."

  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      needs_tag_push: ${{ steps.meta.outputs.needs_tag_push }}
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
            NEEDS_TAG_PUSH=false
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            NEEDS_TAG_PUSH=true
          else
            TAG="daily-$(date -u +%Y%m%d)"
            NEEDS_TAG_PUSH=true
          fi

          if [[ ! "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?|daily-[0-9]{8})$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ "$TAG" == daily-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "needs_tag_push=$NEEDS_TAG_PUSH"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved release tag: $TAG"
          echo "Build version: $VERSION"

  build:
    needs: metadata
    uses: ./.github/workflows/build-platforms.yml
    with:
      version: ${{ needs.metadata.outputs.version }}

  build-and-release:
    needs: [metadata, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Leave empty unless there is a distinct, explicitly configured public mirror.
      PUBLIC_RELEASES_REPO: ""
      PUBLIC_RELEASES_BRANCH: main

    steps:
      - name: Checkout release source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify toolchain consistency
        run: bash scripts/verify_toolchain_consistency.sh
      - name: Verify release evidence (if committed)
        run: |
          if [[ -f docs/review/release_evidence_latest.env ]]; then
            bash scripts/verify_release_evidence.sh
          fi
      - name: Download verified platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: platform-bundles
      - name: Assemble and verify complete release payload
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mkdir -p dist
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar -xzf "platform-bundles/platform-$platform/bundle-$platform.tar.gz" -C dist
          done
          bash scripts/verify_release_artifacts.sh dist all
          cp inst/envs/*.yaml dist/
          python3 scripts/ci/release-metadata.py dist "$TAG" "$GITHUB_SHA"
          (cd dist && sha256sum --check checksums.txt)

      - name: Create or update release tag
        if: needs.metadata.outputs.needs_tag_push == 'true'
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [[ "$TAG" == daily-* ]]; then
            git tag -fa "$TAG" "$GITHUB_SHA" -m "Daily release ${TAG}"
            git push --force "$REMOTE" "refs/tags/${TAG}"
          else
            if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on origin" >&2
              exit 1
            fi
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release ${TAG}"
            git push "$REMOTE" "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Explicit rather than inherited: a release left as a draft is invisible, and
          # releases/latest ignores drafts, so the documented install URL 404s until someone
          # publishes it by hand — and a later run of this workflow puts it back.
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          body: |
            ## Release Model

            - Stable releases are built from immutable tags; the schedule and manual dispatch without a tag publish the daily prerelease.
            - Linux amd64 and arm64 assets are static musl or pure Go executables (`*-linux-*-static`).
            - macOS Intel and Apple Silicon assets use the system runtime (`*-darwin-*`).
            - Container images are not built here; `holt` is a submodule and its `holt-run` image follows the newest stable release.
            - All platforms are built and smoke-tested natively before publishing. `bamdriver` is a Go library, not a standalone executable.
            - On macOS Intel, the installer installs binaries only: the pinned Bismark environment is not available for `osx-64`.

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/otterlab-bio/otter/main/scripts/install.sh)
            ```

            Or download the matching `otter-install` asset below and run `chmod +x otter-install && ./otter-install`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask the holt container repository to rebuild
        # holt-run resolves the newest stable OTTER release at build time. A
        # dispatch makes the image rebuild promptly after this release instead
        # of waiting for its weekly schedule. Skipped when no PAT is configured.
        env:
          SUBMODULES_PAT: ${{ secrets.SUBMODULES_PAT }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if [[ -z "${SUBMODULES_PAT}" ]]; then
            echo "::notice::SUBMODULES_PAT is not configured; holt will pick up ${TAG} on its weekly rebuild."
            exit 0
          fi
          payload="$(printf '{"event_type":"otter-release","client_payload":{"tag":"%s"}}' "${TAG}")"
          if ! curl -fsS -X POST \
            -H "Authorization: Bearer ${SUBMODULES_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/otterlab-bio/holt/dispatches \
            -d "${payload}"; then
            echo "::warning::Could not dispatch to otterlab-bio/holt; the weekly rebuild still picks up ${TAG}."
          fi

      - name: Check public release mirror configuration
        id: public_release_config
        env:
          PUBLIC_RELEASES_PAT: ${{ secrets.SUBMODULES_PAT }}
        run: |
          if [[ -z "${PUBLIC_RELEASES_REPO}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${PUBLIC_RELEASES_PAT}" ]]; then
            echo "::warning::SUBMODULES_PAT is not configured; skipping publish to ${PUBLIC_RELEASES_REPO}."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Prepare public release mirror refs
        if: steps.public_release_config.outputs.enabled == 'true'
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          PUBLIC_RELEASES_PAT: ${{ secrets.SUBMODULES_PAT }}
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          cd "$tmp_dir"
          git init --initial-branch "$PUBLIC_RELEASES_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p scripts release-metadata
          cp "$GITHUB_WORKSPACE/scripts/install.sh" scripts/install.sh

          cat > README.md <<EOF
          # otter release mirror

          Public mirror for the otter install script and environment YAML assets. Release
          binaries live in their own releases; this branch only carries the installer.

          ## Install

          ```bash
          bash <(curl -fsSL https://raw.githubusercontent.com/${PUBLIC_RELEASES_REPO}/${PUBLIC_RELEASES_BRANCH}/scripts/install.sh)
          ```

          ## Notes

          - Source repository: https://github.com/${GITHUB_REPOSITORY}
          - Source commit: ${GITHUB_SHA}
          - Published tag: ${TAG}
          - Updated at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          cat > release-metadata/index.json <<EOF
          {
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_commit": "${GITHUB_SHA}",
            "tag": "${TAG}",
            "workflow_run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "updated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git add README.md scripts/install.sh release-metadata/index.json
          git commit -m "Sync ${TAG}" >/dev/null

          REMOTE="https://x-access-token:${PUBLIC_RELEASES_PAT}@github.com/${PUBLIC_RELEASES_REPO}.git"
          git push --force "$REMOTE" "HEAD:refs/heads/${PUBLIC_RELEASES_BRANCH}"

          if [[ "$TAG" == daily-* ]]; then
            git tag -fa "$TAG" HEAD -m "Daily release mirror ${TAG}"
            git push --force "$REMOTE" "refs/tags/${TAG}"
          else
            if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on ${PUBLIC_RELEASES_REPO}" >&2
              exit 1
            fi
            git tag -a "$TAG" HEAD -m "Release mirror ${TAG}"
            git push "$REMOTE" "refs/tags/${TAG}"
          fi

      - name: Create public mirror release
        if: steps.public_release_config.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_RELEASES_REPO }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ env.PUBLIC_RELEASES_BRANCH }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          body: |
            ## Public Mirror

            - Source repository: https://github.com/${{ github.repository }}
            - Source commit: `${{ github.sha }}`
            - Mirror branch: `${{ env.PUBLIC_RELEASES_BRANCH }}`
            - Purpose: public binary and installer distribution for proxy-friendly downloads

            ## Installation

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/${{ env.PUBLIC_RELEASES_REPO }}/${{ env.PUBLIC_RELEASES_BRANCH }}/scripts/install.sh)
            ```

      - name: Job summary
        if: always()
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          bash scripts/ci/job-summary.sh             --verdict "${{ job.status }}"             --title "OTTER — Release Binaries"             --scope "$TAG"             --checked "The Linux and macOS amd64/arm64 builds must pass format and native startup checks, plus Linux static-linkage checks, before all four bundles can be published together."             --check "Release payload|all four platform bundles plus environment YAML, manifest and checksums|see release assets|-"             --limit "Native startup checks do not assert availability of third-party conda packages or perform full workflow runs."
