name: OTTER end-to-end

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Craftmake's module requires a newer toolchain than the umbrella's
          # declared go directive, so pin the toolchain that builds both.
          go-version: '1.26.3'
          cache: true

      - name: Build otter, craftmake, stub-registry, and otter-install
        run: |
          set -euo pipefail
          mkdir -p build
          go build -o build/otter .
          ( cd craftmake && go build -o ../build/craftmake ./cmd/craftmake )
          go build -o build/stub-registry ./internal/e2esupport/cmd/stub-registry
          ( cd installer && go build -o ../build/otter-install . )
          ls -l build

      - name: Run the offline end-to-end rehearsal
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/otter-e2e-artifacts
        run: |
          bash scripts/e2e/otter_e2e.sh \
            --otter build/otter \
            --craftmake build/craftmake \
            --stub-registry build/stub-registry \
            --installer build/otter-install \
            --scenarios rrbs,rnaseq,bs-pdx,rna-pdx \
            --work-dir "${{ runner.temp }}/otter-e2e-work" \
            --artifacts-dir "$ARTIFACTS_DIR"

      - name: Upload end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otter-e2e-evidence
          path: ${{ runner.temp }}/otter-e2e-artifacts
          retention-days: 30

      - name: Job summary
        if: always()
        continue-on-error: true
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/otter-e2e-artifacts
        run: |
          stage_results="${ARTIFACTS_DIR}/stage-results.tsv"
          passed="$(awk -F'|' '$2=="pass" || $2=="expected-failure" {count++} END {print count+0}' "${stage_results}" 2>/dev/null || echo 0)"
          failed="$(awk -F'|' '$2=="fail" || $2=="unexpected-pass" || $2=="wrong-error" {count++} END {print count+0}' "${stage_results}" 2>/dev/null || echo 0)"
          total="$(awk -F'|' 'NR>1 {count++} END {print count+0}' "${stage_results}" 2>/dev/null || echo 0)"
          registry_releases="$(grep -c '^global/registry-' "${stage_results}" 2>/dev/null || echo 0)"
          snapshot_contracts="$(grep -c '/snapshot-contract|' "${stage_results}" 2>/dev/null || echo 0)"
          plan_envelopes="$(grep -c '/craftmake-plan-envelope|' "${stage_results}" 2>/dev/null || echo 0)"
          guard_results="$(grep -c 'expected-failure' "${stage_results}" 2>/dev/null || echo 0)"
          install_leg="$(awk -F'|' '$1=="install/otter-install-dry-run" {print $2}' "${stage_results}" 2>/dev/null || echo unknown)"
          snakemake_leg="$(awk -F'|' '$1=="legacy/run-snakemake-dry-run-stub" {print $2}' "${stage_results}" 2>/dev/null || echo unknown)"
          migrated_executor="$(awk -F'|' '$1=="legacy/migrated-snapshot-executor" {print $2}' "${stage_results}" 2>/dev/null || echo unknown)"
          site_generate="$(awk -F'|' '$1=="site/generate" {print $2}' "${stage_results}" 2>/dev/null || echo unknown)"
          site_validate="$(awk -F'|' '$1=="site/validate-reads-the-named-profile" {print $2}' "${stage_results}" 2>/dev/null || echo unknown)"
          site_consumed="$(awk -F'|' '$1=="site/profile-supplied-the-reference-root" {print $2}' "${stage_results}" 2>/dev/null || echo unknown)"

          bash scripts/ci/job-summary.sh \
            --verdict "${{ job.status }}" \
            --title "OTTER — offline end-to-end rehearsal" \
            --checked "Runs otter-init, otter create, config resolve, and otter run --dry-run for four scenarios against a simulated reference registry, then the legacy compatibility track through config migrate, then cross-track guards. No reference genome is downloaded and no workflow task executes." \
            --check "Rehearsal stages passed|all stages pass|${passed}/${total}|-" \
            --check "Rehearsal stages failed|0|${failed}|-" \
            --check "Canonical create resolves to immutable otter.run/v1|1 per scenario|${snapshot_contracts}/4|-" \
            --check "Craftmake plan envelope returned|1 per scenario|${plan_envelopes}/4|-" \
            --check "Cross-track, executor, and site refusals with the expected message|10|${guard_results}|-" \
            --check "Migrated legacy snapshot selects snakemake|pass|${migrated_executor}|-" \
            --check "Snakemake executor plans from the snapshot (stub runtime)|pass|${snakemake_leg}|-" \
            --check "otter-install dry-run plan|pass|${install_leg}|-" \
            --check "otter site generate writes a loadable profile|pass|${site_generate}|-" \
            --check "otter site validate reads the named profile|pass|${site_validate}|-" \
            --check "Generated profile supplies the reference root at resolve|pass|${site_consumed}|-" \
            --metric "Scenarios|rrbs, rnaseq, bs-pdx, rna-pdx" \
            --metric "Site profile|generated into a work-local HOME, consumed by config resolve" \
            --metric "Reference releases|${registry_releases} simulated releases (hg19, hg38, mm10)" \
            --metric "Reference releases|${registry_releases} simulated releases named <assembly>-<annotation>-<version>" \
            --metric "Craftmake toolchain|built from the craftmake submodule at this commit" \
            --artifact "otter-e2e-evidence" \
            --limit "Contract compatibility only. Reference releases are simulated by stub-registry: real directory layout, reference.yaml, manifest.json, and digest relationships, verified by the production reference verifier, but FASTA/GTF payloads and index files are placeholders. The Craftmake leg stops at 'plan'; no task executed and no scientific output exists. The Snakemake compatibility leg uses a stub 'snakemake --version' executable, so it proves Otter-side dispatch and planning, not execution. The install leg runs otter-install --dry-run only. Site profiles are exercised as a LOCAL profile under a work-local HOME: the default locator, list, validate, the overwrite guard, and the resolve-time reference-root handover all run, but SLURM cluster probing (sinfo, sacctmgr, srun compute-node checks) does not, so a generated slurm profile is only structurally validated."
